<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Eman</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Playfair Display', serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* Background photo slideshow */
  #bg-slideshow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -3;
  }

  .bg-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    filter: brightness(0.55) saturate(0.9);
    animation: slideshow 25s infinite;
  }

  .bg-slide:nth-child(1) { animation-delay: 0s; }
  .bg-slide:nth-child(2) { animation-delay: 5s; }
  .bg-slide:nth-child(3) { animation-delay: 10s; }
  .bg-slide:nth-child(4) { animation-delay: 15s; }
  .bg-slide:nth-child(5) { animation-delay: 20s; }

  @keyframes slideshow {
    0% { opacity: 0; }
    4% { opacity: 1; }
    20% { opacity: 1; }
    24% { opacity: 0; }
    100% { opacity: 0; }
  }

  /* Soft rose overlay so text stays readable and mood stays romantic */
  #bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg,
      rgba(40, 5, 20, 0.55) 0%,
      rgba(80, 10, 35, 0.35) 40%,
      rgba(40, 5, 20, 0.65) 100%);
    z-index: -2;
  }

  #hearts-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
  }

  .floating-item {
    position: absolute;
    bottom: -40px;
    font-size: 28px;
    animation: floatUp 5s ease-in forwards;
    opacity: 1;
    user-select: none;
    /* no shadow/blur - kept crisp and clear */
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(-110vh) translateX(var(--drift, 0px)) rotate(360deg);
      opacity: 0;
    }
  }

  #content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
    max-width: 90%;
  }

  #sentence {
    font-family: 'Playfair Display', serif;
    font-size: 46px;
    font-weight: 700;
    color: #fff5f8;
    text-shadow: 0 2px 12px rgba(0,0,0,0.55), 0 0 30px rgba(255,150,180,0.3);
    line-height: 1.5;
    min-height: 140px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    letter-spacing: 0.5px;
  }

  .word {
    opacity: 0;
    transform: translateY(10px);
    animation: appear 0.6s forwards;
  }

  .word.accent {
    color: #ffb3c6;
    font-style: italic;
  }

  @keyframes appear {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  #signature {
    margin-top: 28px;
    font-family: 'Great Vibes', cursive;
    font-size: 52px;
    color: #ffd9e3;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    opacity: 0;
    transition: opacity 1.2s ease;
    position: relative;
    display: inline-block;
  }

  #signature.show {
    opacity: 1;
  }

  #signature::before,
  #signature::after {
    content: '❦';
    font-family: serif;
    font-size: 20px;
    color: #ffb3c6;
    vertical-align: middle;
    margin: 0 14px;
    opacity: 0.8;
  }

  #heart-button {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 64px;
    cursor: pointer;
    z-index: 3;
    user-select: none;
    transition: transform 0.15s ease;
    /* no drop-shadow - kept crisp/clear */
  }

  #heart-button:active {
    transform: translateX(-50%) scale(1.3);
  }

  #counter {
    position: fixed;
    top: 20px;
    right: 20px;
    font-family: 'Dancing Script', cursive;
    font-size: 20px;
    color: #ffe3ea;
    opacity: 0.85;
    z-index: 3;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }

  #final-message {
    margin-top: 18px;
    font-family: 'Dancing Script', cursive;
    font-size: 30px;
    color: #ffe3ea;
    opacity: 0;
    transition: opacity 1s ease;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }

  #final-message.show {
    opacity: 1;
  }
</style>
</head>
<body>

  <div id="bg-slideshow">
    <div class="bg-slide" style="background-image: url('background1.jpg');"></div>
    <div class="bg-slide" style="background-image: url('background2.jpg');"></div>
    <div class="bg-slide" style="background-image: url('background3.jpg');"></div>
    <div class="bg-slide" style="background-image: url('background4.jpg');"></div>
    <div class="bg-slide" style="background-image: url('background5.jpg');"></div>
  </div>
  <div id="bg-overlay"></div>
  <div id="hearts-layer"></div>

  <div id="content">
    <div id="sentence"></div>
    <div id="signature">Alaa</div>
    <div id="final-message">Thank you 😊💕</div>
  </div>

  <div id="counter">0 / 50</div>

  <div id="heart-button">❤️</div>

  <script>
    const sentence = "I will love you Eman forever".split(" ");
    const accentWords = ["Eman", "forever"];
    const sentenceEl = document.getElementById('sentence');
    const signatureEl = document.getElementById('signature');
    const finalMessageEl = document.getElementById('final-message');
    const heartsLayer = document.getElementById('hearts-layer');
    const heartButton = document.getElementById('heart-button');
    const counterEl = document.getElementById('counter');

    const MAX_CLICKS = 50;
    let clickCount = 0;

    const heartEmojis = ['❤️', '💖', '💕', '💗', '💓', '💘'];

    function addWord(index) {
      const span = document.createElement('span');
      span.classList.add('word');
      if (accentWords.includes(sentence[index])) {
        span.classList.add('accent');
      }
      span.textContent = sentence[index];
      sentenceEl.appendChild(span);
    }

    function createFloatingItem(emoji) {
      const item = document.createElement('div');
      item.classList.add('floating-item');
      item.textContent = emoji;
      item.style.left = Math.random() * 100 + 'vw';
      item.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
      item.style.fontSize = (20 + Math.random() * 30) + 'px';
      item.style.animationDuration = (4 + Math.random() * 3) + 's';
      heartsLayer.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, 8000);
    }

    // Hearts and a sunflower only ever appear as a direct result of a click.
    heartButton.addEventListener('click', () => {
      if (clickCount >= MAX_CLICKS) return;

      clickCount++;
      counterEl.textContent = clickCount + ' / ' + MAX_CLICKS;

      if (clickCount <= sentence.length) {
        addWord(clickCount - 1);
      } else if (clickCount === sentence.length + 1) {
        signatureEl.classList.add('show');
      }

      const heartEmoji = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      createFloatingItem(heartEmoji);
      createFloatingItem('🌻');

      if (clickCount >= MAX_CLICKS) {
        finalMessageEl.classList.add('show');
        heartButton.style.pointerEvents = 'none';
        heartButton.style.opacity = '0.5';
      }
    });
  </script>

</body>
</html>
